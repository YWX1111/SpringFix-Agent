# SpringFix Agent CI
#
# Two independent jobs:
#   - python-quality: Python 3.11 static analysis + unit/integration tests
#   - sample-bug-verification: Java 21 + Maven verification of all M4B
#     benchmark samples via scripts/verify_benchmark_samples.py
#
# Neither job calls any external LLM API. Neither job uploads secrets.

name: SpringFix Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Allow concurrent runs but cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src/ tests/ scripts/

      - name: MyPy strict
        run: uv run mypy --strict src/

      - name: Pytest
        run: uv run pytest tests/ -v --tb=short

  sample-bug-verification:
    name: Benchmark sample verification (Java 21 + Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Verify Maven
        run: mvn --version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Validate benchmark manifest
        run: uv run python scripts/validate_agent_benchmark.py

      - name: Run benchmark sample verification
        run: uv run python scripts/verify_benchmark_samples.py
